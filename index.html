<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tosh Otar">
<meta name="theme-color" content="#141029">
<meta name="description" content="Tosh Otar — zambarakni suring, raqamli toshlarni sindiring, tanga yig'ib kuchaying.">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Tosh Otar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;600;800&display=swap">
<style>
  /* Layout: butun ekran bitta vertikal o'yin maydoni (canvas), ustida HUD va menyu/do'kon oynalari. Uslub: yorqin, yumshoq "konfet" ranglar, qorong'i ramka. */
  :root {
    --bg: #141029;
    --panel: #221b45;
    --line: #3a3170;
    --fg: #fff8ec;
    --muted: #b7aedf;
    --gold: #ffc93c;
    --go: #ff5d8f;
    --display: "Lilita One", "Arial Black", sans-serif;
    --body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--body);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #wrap { position: relative; }
  canvas { display: block; touch-action: none; }
  @media (min-aspect-ratio: 10/16) { canvas { border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,.6); } }

  .hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 0; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .pill { background: rgba(20,16,41,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border-radius: 999px; padding: 6px 12px; font: 400 18px/1 var(--display); display: flex; align-items: center; gap: 6px; }
  .coin { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2b0, var(--gold) 55%, #d99a00); box-shadow: 0 0 0 2px rgba(0,0,0,.15) inset; }
  .lvl { text-align: center; }
  .lvl small { display: block; font: 600 11px/1 var(--body); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .prog { width: 120px; height: 8px; border-radius: 4px; background: rgba(20,16,41,.55); overflow: hidden; margin-top: 6px; }
  .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7cf5c3, #3dd6ff); border-radius: 4px; transition: width .2s; }
  .hud .btn { pointer-events: auto; }

  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; background: rgba(20,16,41,.78);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .screen[hidden] { display: none; }
  .screen h1 { margin: 0; font: 400 clamp(44px, 14vw, 64px)/.95 var(--display); color: var(--gold); text-shadow: 0 5px 0 #b46a00, 0 12px 30px rgba(0,0,0,.4); }
  .screen h2 { margin: 0; font: 400 34px/1 var(--display); }
  .screen p { margin: 0; color: var(--muted); max-width: 30ch; line-height: 1.45; }
  .big { font: 400 26px/1 var(--display); color: var(--fg) !important; }

  button { font: 800 16px/1 var(--body); color: var(--fg); background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 12px 18px; cursor: pointer; }
  button:active { transform: translateY(2px); }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .play { background: var(--go); border-color: transparent; font: 400 26px/1 var(--display); padding: 16px 44px; box-shadow: 0 6px 0 #b8325e; letter-spacing: .03em; }
  .play:active { box-shadow: 0 2px 0 #b8325e; transform: translateY(4px); }
  .btn { width: 40px; height: 40px; padding: 0; border-radius: 12px; font-size: 18px; display: grid; place-items: center; }

  .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(340px, 100%); }
  .up { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; border-radius: 16px; text-align: center; }
  .up b { font: 400 17px/1 var(--display); }
  .up small { color: var(--muted); font-size: 12px; font-weight: 600; }
  .up .cost { display: flex; align-items: center; gap: 5px; color: var(--gold); font: 400 18px/1 var(--display); }
  .up:disabled { opacity: .45; cursor: not-allowed; }
  .hint { font-size: 13px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" aria-label="Tosh Otar o'yin maydoni"></canvas>

  <div class="hud">
    <div class="pill"><span class="coin"></span><span id="coins">0</span></div>
    <div class="lvl pill" style="flex-direction:column;gap:0;border-radius:14px;padding:6px 12px 8px">
      <small>Daraja</small><span id="lvl">1</span>
      <div class="prog"><i id="prog"></i></div>
    </div>
    <button class="btn" id="bPause" aria-label="Pauza">❚❚</button>
  </div>

  <div class="screen" id="sMenu">
    <h1>TOSH<br>OTAR</h1>
    <p>Zambarakni barmoq bilan suring — u o'zi otadi. Raqam — toshni sindirish uchun kerak bo'lgan zarbalar soni.</p>
    <p class="big" id="mLvl">Daraja 1</p>
    <button class="play" id="bPlay">O'YNASH</button>
    <div class="shop" id="shop"></div>
    <p class="hint">Kompyuterda: sichqoncha yoki ← → · P — pauza · M — ovoz</p>
  </div>

  <div class="screen" id="sWin" hidden>
    <h2>DARAJA O'TILDI!</h2>
    <p class="big" id="wCoins">+0</p>
    <button class="play" id="bNext">DAVOM</button>
  </div>

  <div class="screen" id="sLose" hidden>
    <h2>TOSH TEGDI!</h2>
    <p id="lText">Kuchingizni oshirib, qayta urinib ko'ring.</p>
    <p class="big" id="lCoins">+0</p>
    <button class="play" id="bRetry">QAYTA</button>
  </div>

  <div class="screen" id="sPause" hidden>
    <h2>PAUZA</h2>
    <button class="play" id="bResume">DAVOM</button>
    <button id="bMute">Ovoz: yoqiq</button>
    <button id="bQuit">Menyuga chiqish</button>
  </div>
</div>

<script>
(() => {
  const W = 400, H = 720;                     // mantiqiy o'lcham (9:16 ga yaqin)
  const GROUND = H - 110, GRAV = 900;
  const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
  const $ = id => document.getElementById(id);

  // ---------- saqlash ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const save = store.get('toshotar', { coins: 0, level: 1, fire: 1, power: 1, muted: false });
  const persist = () => store.set('toshotar', save);

  // ---------- o'lcham ----------
  let scale = 1, dpr = 1;
  function resize() {
    scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    dpr = Math.min(3, window.devicePixelRatio || 1);
    cvs.style.width = W * scale + 'px'; cvs.style.height = H * scale + 'px';
    cvs.width = Math.round(W * scale * dpr); cvs.height = Math.round(H * scale * dpr);
    $('wrap').style.width = W * scale + 'px'; $('wrap').style.height = H * scale + 'px';
  }
  window.addEventListener('resize', resize); resize();

  // ---------- ovoz ----------
  let ac = null;
  function sfx(f, d = .06, type = 'square', v = .04, slide = 0) {
    if (save.muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02);
    } catch {}
  }
  let lastShotSfx = 0;

  // ---------- kuchaytirishlar ----------
  const fireRate = () => 7 + (save.fire - 1) * 1.6;           // o'q/soniya
  const shotDmg = () => 1 + (save.power - 1) * .5;             // bitta o'q zarbasi
  const upCost = n => Math.round(15 * Math.pow(1.45, n - 1));

  // ---------- daraja ----------
  // Toshning "tier"i: 3 — eng katta, 0 — eng kichik. Sinsa — ikkita tier-1 ga bo'linadi.
  const RAD = [15, 23, 32, 42];
  const PALETTE = [
    ['#ff6b8b', '#d13d63'], ['#ffa94d', '#d9741a'], ['#7c8cff', '#4b58d6'],
    ['#4fd8a8', '#21a777'], ['#c77dff', '#9145d1'], ['#ffd84d', '#d4a80f']
  ];
  function levelPlan(L) {
    // har darajada toshlar soni va kuchi oshadi; har 5-darajada "boss"
    const boss = L % 5 === 0;
    const base = 3 + L * 3;
    const list = [];
    const n = boss ? 1 : Math.min(2 + Math.floor(L / 2), 7);
    for (let i = 0; i < n; i++) {
      const tier = boss ? 3 : Math.min(3, 1 + Math.floor(Math.random() * (1 + Math.min(2, L / 3))));
      const hp = Math.round((boss ? base * 6 : base * (0.6 + Math.random() * .8)) * (1 + tier * .35));
      list.push({ tier, hp, delay: i * (3.2 - Math.min(1.6, L * .08)) });
    }
    return { list, boss };
  }

  // ---------- holat ----------
  let state = 'menu', rocks = [], bullets = [], parts = [], coinsF = [], pops = [];
  let cannon = { x: W / 2, tx: W / 2, w: 52 }, fireAcc = 0, spawnQ = [], spawnT = 0;
  let totalHp = 1, doneHp = 0, earned = 0, shake = 0, time = 0, recoil = 0;

  function startLevel() {
    rocks = []; bullets = []; parts = []; coinsF = []; pops = [];
    cannon.x = cannon.tx = W / 2; fireAcc = 0; spawnT = 0; earned = 0; shake = 0;
    const plan = levelPlan(save.level);
    spawnQ = plan.list.slice();
    // umumiy HP: tosh sinsa bo'laklari ham sanaladi
    totalHp = spawnQ.reduce((s, r) => s + hpTree(r.hp, r.tier), 0); doneHp = 0;
    setScreen(null); state = 'play';
    $('lvl').textContent = save.level + (plan.boss ? ' · BOSS' : '');
    updateHud();
    sfx(330, .08, 'triangle', .06); setTimeout(() => sfx(500, .1, 'triangle', .06), 90);
  }
  const childHp = hp => Math.max(1, Math.ceil(hp * .45));
  const hpTree = (hp, tier) => tier <= 0 ? hp : hp + 2 * hpTree(childHp(hp), tier - 1);

  function spawnRock(spec, x, y, vx, vy) {
    const r = RAD[spec.tier];
    const side = Math.random() < .5;
    rocks.push({
      x: x ?? (side ? -r : W + r), y: y ?? 120 + Math.random() * 100,
      vx: vx ?? (side ? 1 : -1) * (40 + Math.min(40, save.level * 4) + Math.random() * 30), vy: vy ?? 0,
      r, tier: spec.tier, hp: spec.hp, max: spec.hp, entering: x === undefined,
      col: PALETTE[(Math.random() * PALETTE.length) | 0], rot: Math.random() * 6, spin: (Math.random() - .5) * 2,
      flash: 0, sides: 7 + (Math.random() * 3 | 0)
    });
  }

  // tosh har safar yerga tushganda bir xil balandlikka sakrashi uchun
  const bounceV = r => -Math.sqrt(2 * GRAV * (GROUND - r - (140 + (3 - RAD.indexOf(r)) * 70)));

  function hitRock(k, dmg) {
    const rk = rocks[k];
    const real = Math.min(rk.hp, dmg);
    rk.hp -= dmg; doneHp += real; rk.flash = .06;
    if (rk.hp <= 0) breakRock(k);
  }
  function breakRock(k) {
    const rk = rocks[k];
    rocks.splice(k, 1);
    burst(rk.x, rk.y, rk.col[0], 18 + rk.tier * 8, rk.r);
    shake = Math.max(shake, 3 + rk.tier * 2.5);
    sfx(180 - rk.tier * 25, .18, 'sawtooth', .05, -120);
    // tangalar
    const n = 1 + rk.tier;
    for (let i = 0; i < n; i++) coinsF.push({ x: rk.x, y: rk.y, vx: (Math.random() - .5) * 160, vy: -150 - Math.random() * 150, t: 0 });
    if (rk.tier > 0) {
      const hp = childHp(rk.max);
      for (const s of [-1, 1]) spawnRock({ tier: rk.tier - 1, hp }, rk.x + s * 6, rk.y, s * (70 + Math.random() * 30), -260);
    }
  }

  function burst(x, y, color, n, r = 10) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 260;
      parts.push({ x: x + Math.cos(a) * r * .5, y: y + Math.sin(a) * r * .5, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 1, color, sz: 3 + Math.random() * 5, rot: Math.random() * 6 });
    }
  }

  function lose() {
    state = 'dying'; shake = 16;
    burst(cannon.x, GROUND - 20, '#ffffff', 30, 20);
    sfx(140, .6, 'sawtooth', .07, -100);
    save.coins += earned; persist();
    setTimeout(() => { $('lCoins').innerHTML = `+${earned} <span class="coin" style="display:inline-block;vertical-align:-1px"></span>`; setScreen('sLose'); }, 900);
  }
  function win() {
    state = 'won';
    const bonus = 10 + save.level * 3;
    earned += bonus;
    save.coins += earned; save.level++; persist();
    sfx(523, .1, 'triangle', .06); setTimeout(() => sfx(659, .1, 'triangle', .06), 110); setTimeout(() => sfx(784, .18, 'triangle', .06), 220);
    setTimeout(() => { $('wCoins').innerHTML = `+${earned} <span class="coin" style="display:inline-block;vertical-align:-1px"></span>`; setScreen('sWin'); }, 700);
  }

  // ---------- yangilash ----------
  function update(dt) {
    time += dt;
    // zambarak
    const prevX = cannon.x;
    cannon.x += (cannon.tx - cannon.x) * Math.min(1, dt * 18);
    cannon.x = Math.max(cannon.w / 2 + 6, Math.min(W - cannon.w / 2 - 6, cannon.x));
    cannon.wheel = (cannon.wheel || 0) + (cannon.x - prevX) / 14;
    recoil = Math.max(0, recoil - dt * 40);

    if (state === 'play') {
      // otish
      fireAcc += dt * fireRate();
      while (fireAcc >= 1) {
        fireAcc -= 1;
        bullets.push({ x: cannon.x + (Math.random() - .5) * 4, y: GROUND - 62, vy: -900 });
        recoil = 3;
        if (time - lastShotSfx > .07) { sfx(900 + Math.random() * 120, .025, 'square', .015); lastShotSfx = time; }
      }
      // toshlar navbati
      spawnT += dt;
      while (spawnQ.length && spawnQ[0].delay <= spawnT) spawnRock(spawnQ.shift());
    }

    // o'qlar
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i]; b.y += b.vy * dt;
      if (b.y < -20) { bullets.splice(i, 1); continue; }
      for (let k = rocks.length - 1; k >= 0; k--) {
        const rk = rocks[k];
        if (Math.abs(b.x - rk.x) < rk.r + 4 && Math.abs(b.y - rk.y) < rk.r + 8 && Math.hypot(b.x - rk.x, b.y - rk.y) < rk.r + 5) {
          bullets.splice(i, 1);
          if (state === 'play') hitRock(k, shotDmg());
          if (Math.random() < .3) parts.push({ x: b.x, y: rk.y + rk.r * .6, vx: (Math.random() - .5) * 120, vy: 60, life: .5, color: '#fff6c8', sz: 3, rot: 0 });
          break;
        }
      }
    }

    // toshlar
    for (const rk of rocks) {
      rk.vy += GRAV * dt;
      rk.x += rk.vx * dt; rk.y += rk.vy * dt;
      rk.rot += rk.spin * dt; rk.flash = Math.max(0, rk.flash - dt);
      if (rk.entering) { if (rk.x > rk.r && rk.x < W - rk.r) rk.entering = false; }
      else {
        if (rk.x < rk.r) { rk.x = rk.r; rk.vx = Math.abs(rk.vx); }
        if (rk.x > W - rk.r) { rk.x = W - rk.r; rk.vx = -Math.abs(rk.vx); }
      }
      if (rk.y > GROUND - rk.r) {
        rk.y = GROUND - rk.r; rk.vy = bounceV(rk.r);
        if (rk.tier >= 2) shake = Math.max(shake, 2);
      }
      // zambarakka tegdimi
      if (state === 'play') {
        const cx = Math.max(cannon.x - cannon.w / 2, Math.min(rk.x, cannon.x + cannon.w / 2));
        const cy = Math.max(GROUND - 58, Math.min(rk.y, GROUND));
        if (Math.hypot(rk.x - cx, rk.y - cy) < rk.r - 6) lose();
      }
    }

    // tangalar
    for (let i = coinsF.length - 1; i >= 0; i--) {
      const c = coinsF[i]; c.t += dt;
      if (c.t < .5) { c.vy += GRAV * dt; c.x += c.vx * dt; c.y += c.vy * dt; if (c.y > GROUND - 8) { c.y = GROUND - 8; c.vy *= -.4; } }
      else { // HUD tomon uchadi
        const tx = 30, ty = 24, k = Math.min(1, dt * 7);
        c.x += (tx - c.x) * k; c.y += (ty - c.y) * k;
        if (Math.hypot(c.x - tx, c.y - ty) < 12) {
          coinsF.splice(i, 1); earned++;
          if (Math.random() < .5) sfx(1300 + Math.random() * 300, .04, 'triangle', .03);
          updateHud();
        }
      }
    }

    // zarrachalar
    for (const p of parts) { p.vy += GRAV * .6 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.4; p.rot += dt * 5; }
    parts = parts.filter(p => p.life > 0);
    shake = Math.max(0, shake - dt * 30);

    if (state === 'play') {
      $('prog').style.width = Math.min(100, doneHp / totalHp * 100) + '%';
      if (!rocks.length && !spawnQ.length) win();
    }
  }

  // ---------- chizish ----------
  const SKY = [
    ['#7fd3ff', '#d8f3ff', '#a8d78f', '#6bb85a'],   // kunduz
    ['#ff9a7a', '#ffd6a0', '#c79a6b', '#9c7448'],   // shom
    ['#1d1a4a', '#4a3a8a', '#3b4d7a', '#283656']    // tun
  ];
  function theme() { return SKY[Math.floor((save.level - 1) / 3) % 3]; }

  function drawBg() {
    const [top, bot, hill, ground] = theme();
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, top); g.addColorStop(1, bot);
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
    // quyosh / oy
    const night = theme() === SKY[2];
    ctx.fillStyle = night ? 'rgba(255,255,230,.9)' : 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.arc(310, 150, 38, 0, 7); ctx.fill();
    if (night) { ctx.fillStyle = 'rgba(255,255,255,.7)'; for (let i = 0; i < 30; i++) ctx.fillRect((i * 97) % W, (i * 53) % 300, 2, 2); }
    // bulutlar
    ctx.fillStyle = night ? 'rgba(255,255,255,.08)' : 'rgba(255,255,255,.6)';
    for (let i = 0; i < 3; i++) {
      const x = ((time * (8 + i * 4) + i * 160) % (W + 160)) - 80, y = 80 + i * 70;
      ctx.beginPath(); ctx.arc(x, y, 22, 0, 7); ctx.arc(x + 24, y - 8, 26, 0, 7); ctx.arc(x + 50, y, 20, 0, 7); ctx.fill();
    }
    // tepaliklar
    ctx.fillStyle = hill;
    ctx.beginPath(); ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, GROUND - 70 - Math.sin(x / 60) * 25 - Math.sin(x / 23) * 8);
    ctx.lineTo(W + 20, GROUND); ctx.lineTo(-20, GROUND); ctx.fill();
    // yer
    ctx.fillStyle = ground; ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    for (let x = 0; x < W; x += 28) { ctx.beginPath(); ctx.arc(x + 14, GROUND + 4, 10, 0, Math.PI); ctx.fill(); }
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(-20, GROUND + 40, W + 40, H);
  }

  function drawCannon() {
    const x = cannon.x, y = GROUND;
    ctx.save(); ctx.translate(x, y);
    // soya
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0, 4, 38, 7, 0, 0, 7); ctx.fill();
    // stvol
    ctx.fillStyle = '#ff5d8f';
    ctx.beginPath(); ctx.roundRect(-13, -64 + recoil, 26, 46, 8); ctx.fill();
    ctx.fillStyle = '#ffd1df'; ctx.fillRect(-13, -64 + recoil, 26, 8);
    ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(4, -56 + recoil, 9, 38);
    // korpus
    ctx.fillStyle = '#3a3170';
    ctx.beginPath(); ctx.roundRect(-26, -30, 52, 20, 9); ctx.fill();
    // g'ildiraklar
    for (const s of [-1, 1]) {
      ctx.save(); ctx.translate(s * 18, -12); ctx.rotate(cannon.wheel || 0);
      ctx.fillStyle = '#221b45'; ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
      ctx.strokeStyle = '#ffc93c'; ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++) { ctx.rotate(Math.PI / 3); ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.stroke(); }
      ctx.fillStyle = '#ffc93c'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.fill();
      ctx.restore();
    }
    // og'iz chaqnashi
    if (recoil > 1.5 && state === 'play') {
      ctx.fillStyle = 'rgba(255,240,170,.9)';
      ctx.beginPath(); ctx.arc(0, -68, 7 + Math.random() * 4, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function drawRock(rk) {
    ctx.save(); ctx.translate(rk.x, rk.y);
    // soya yerda
    ctx.save(); ctx.translate(0, GROUND - rk.y + 3);
    const d = Math.max(.2, 1 - (GROUND - rk.y) / 500);
    ctx.fillStyle = `rgba(0,0,0,${.18 * d})`; ctx.beginPath(); ctx.ellipse(0, 0, rk.r * d, rk.r * .2 * d, 0, 0, 7); ctx.fill();
    ctx.restore();
    ctx.rotate(rk.rot);
    const n = rk.sides;
    ctx.beginPath();
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; ctx.lineTo(Math.cos(a) * rk.r, Math.sin(a) * rk.r); }
    ctx.closePath();
    ctx.fillStyle = rk.flash > 0 ? '#ffffff' : rk.col[0]; ctx.fill();
    // qirralar (3D his)
    ctx.save(); ctx.clip();
    ctx.fillStyle = rk.col[1];
    ctx.beginPath(); ctx.arc(rk.r * .35, rk.r * .35, rk.r * .95, 0, 7); ctx.fill();
    ctx.fillStyle = rk.flash > 0 ? '#ffffff' : rk.col[0];
    ctx.beginPath(); ctx.arc(-rk.r * .12, -rk.r * .12, rk.r * .78, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(-rk.r * .38, -rk.r * .4, rk.r * .22, 0, 7); ctx.fill();
    ctx.restore();
    ctx.rotate(-rk.rot);
    // raqam
    const hp = Math.ceil(rk.hp);
    const fs = Math.max(13, rk.r * (hp >= 100 ? .62 : .8));
    ctx.font = `${fs}px "Lilita One", "Arial Black", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.strokeText(hp, 0, 2);
    ctx.fillStyle = '#fff'; ctx.fillText(hp, 0, 2);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    drawBg();
    // o'qlar
    ctx.fillStyle = '#fff3b0';
    for (const b of bullets) { ctx.beginPath(); ctx.roundRect(b.x - 3.5, b.y - 9, 7, 16, 3.5); ctx.fill(); }
    if (state !== 'dying' && state !== 'lost') drawCannon();
    for (const rk of rocks) drawRock(rk);
    // zarrachalar
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.sz / 2, -p.sz / 2, p.sz, p.sz); ctx.restore();
    }
    ctx.globalAlpha = 1;
    // tangalar
    for (const c of coinsF) {
      const g = ctx.createRadialGradient(c.x - 2, c.y - 2, 1, c.x, c.y, 8);
      g.addColorStop(0, '#fff2b0'); g.addColorStop(.6, '#ffc93c'); g.addColorStop(1, '#d99a00');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, 7, 0, 7); ctx.fill();
    }
  }

  // ---------- sikl ----------
  let last = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(.033, (now - (last || now)) / 1000); last = now;
    if (state !== 'paused') update(dt);
    draw();
  }

  // ---------- UI ----------
  function setScreen(id) {
    for (const s of ['sMenu', 'sWin', 'sLose', 'sPause']) $(s).hidden = s !== id;
    if (id === 'sMenu') { renderShop(); $('mLvl').textContent = 'Daraja ' + save.level; }
    $('bPause').style.visibility = id ? 'hidden' : 'visible';
    updateHud();
  }
  function updateHud() {
    $('coins').textContent = save.coins + (state === 'play' || state === 'dying' || state === 'won' ? earned * 0 : 0);
    if (state === 'play') $('coins').textContent = save.coins + earned;
  }
  function renderShop() {
    const items = [
      { key: 'fire', name: 'Tezlik', desc: () => fireRate().toFixed(1) + ' o\'q/s' },
      { key: 'power', name: 'Kuch', desc: () => '×' + shotDmg().toFixed(1) + ' zarba' }
    ];
    $('shop').innerHTML = '';
    for (const it of items) {
      const lvl = save[it.key], cost = upCost(lvl);
      const b = document.createElement('button'); b.className = 'up';
      b.innerHTML = `<b>${it.name} ${lvl}</b><small>${it.desc()}</small><span class="cost"><span class="coin"></span>${cost}</span>`;
      b.disabled = save.coins < cost;
      b.onclick = () => {
        if (save.coins < cost) return;
        save.coins -= cost; save[it.key]++; persist();
        sfx(700, .06, 'triangle', .05); setTimeout(() => sfx(1000, .08, 'triangle', .05), 60);
        renderShop(); updateHud();
      };
      $('shop').appendChild(b);
    }
  }

  // boshqaruv: barmoq/sichqoncha nisbiy suriladi
  let drag = null;
  cvs.addEventListener('pointerdown', e => { drag = { x: e.clientX, cx: cannon.tx }; cvs.setPointerCapture(e.pointerId); });
  cvs.addEventListener('pointermove', e => {
    if (drag) cannon.tx = drag.cx + (e.clientX - drag.x) / scale * 1.2;
    else if (e.pointerType === 'mouse') { const r = cvs.getBoundingClientRect(); cannon.tx = (e.clientX - r.left) / scale; }
    cannon.tx = Math.max(32, Math.min(W - 32, cannon.tx));
  });
  const endDrag = () => { drag = null; };
  cvs.addEventListener('pointerup', endDrag); cvs.addEventListener('pointercancel', endDrag);

  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    if (e.code === 'KeyM') toggleMute();
    if ((e.code === 'Space' || e.code === 'Enter') && state !== 'play' && state !== 'paused' && state !== 'dying') { e.preventDefault(); startLevel(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  setInterval(() => {
    const d = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    if (d) cannon.tx = Math.max(32, Math.min(W - 32, cannon.x + d * 30));
  }, 16);

  function togglePause() {
    if (state === 'play') { state = 'paused'; setScreen('sPause'); }
    else if (state === 'paused') { state = 'play'; setScreen(null); }
  }
  function toggleMute() {
    save.muted = !save.muted; persist();
    $('bMute').textContent = 'Ovoz: ' + (save.muted ? "o'chiq" : 'yoqiq');
  }
  $('bPause').onclick = togglePause;
  $('bResume').onclick = togglePause;
  $('bMute').onclick = toggleMute;
  $('bQuit').onclick = () => { save.coins += earned; earned = 0; persist(); rocks = []; state = 'menu'; setScreen('sMenu'); };
  $('bPlay').onclick = startLevel;
  $('bNext').onclick = () => { state = 'menu'; setScreen('sMenu'); };
  $('bRetry').onclick = () => { state = 'menu'; setScreen('sMenu'); };
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

  $('bMute').textContent = 'Ovoz: ' + (save.muted ? "o'chiq" : 'yoqiq');
  setScreen('sMenu');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
